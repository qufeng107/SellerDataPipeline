[project]
name = "seller-data-pipeline"
version = "0.1.0"
description = "Serverless e-commerce seller data pipeline for Amazon operations reporting."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI blocking lint intentionally focuses on correctness/high-signal rules.
# Import sorting (I) and pyupgrade (UP) are maintenance/style checks and must not
# break production delivery; developers may still run them locally with --fix.
select = ["E4", "E7", "E9", "F", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that require real external services",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]

[project]
name = "seller-data-pipeline"
version = "0.1.0"
description = "Serverless e-commerce seller data pipeline for Amazon operations reporting."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that require real external services",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]

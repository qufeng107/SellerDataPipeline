name: Build GHCR image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - requirements*.txt
      - src/**
      - scripts/**
      - sql/**
      - docs/**
      - .github/workflows/build-ghcr-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ghcr-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/seller-data-pipeline

jobs:
  build-and-push:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=seller-data-pipeline
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image references
        run: |
          echo "Pushed image: $IMAGE_NAME:latest"
          echo "Pushed image: $IMAGE_NAME:${GITHUB_SHA}"
